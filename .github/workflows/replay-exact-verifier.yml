name: Replay independent exact supporting-line verifier

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-exact-replay:
    name: Python standard-library exact replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify frozen public integration inventory
        run: sha256sum -c SHA256SUMS.txt

      - name: Reject assert-dependent or dynamic-execution verification
        run: |
          set -euo pipefail
          if rg -n '\bassert\b|__debug__|eval\(|exec\(|subprocess|os\.system|shell=True|requests|urllib|socket|https?://' verification/verify_k607_stdlib.py; then
            echo 'Verifier contains an optimization-sensitive assertion, dynamic execution, subprocess, or network path.' >&2
            exit 1
          fi

      - name: Replay normally and compare exact output
        run: |
          set -euo pipefail
          python3 -B verification/verify_k607_stdlib.py > /tmp/K607_REPLAY.actual.txt
          diff -u verification/EXPECTED_K607_STDLIB.txt /tmp/K607_REPLAY.actual.txt

      - name: Replay under optimization and compare exact output
        run: |
          set -euo pipefail
          python3 -O -B verification/verify_k607_stdlib.py > /tmp/K607_REPLAY.optimized.actual.txt
          diff -u verification/EXPECTED_K607_STDLIB.txt /tmp/K607_REPLAY.optimized.actual.txt
